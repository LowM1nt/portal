# Publica o painel no Cloudflare Pages a cada push na main que mexa em apps/painel.
# Segredos do repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Variáveis do repo (públicas): VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY.
name: Painel (deploy)
on:
  push:
    branches: [main]
    paths: ["apps/painel/**", ".github/workflows/painel-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/painel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/painel/package-lock.json }
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Publicar no Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Segredos CLOUDFLARE_* ausentes no repo: deploy pulado."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name m1nt-painel --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
