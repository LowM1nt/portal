# portal/.github/workflows/ci.yml
# Portões que rodam no GitHub: build, tipos, lint e testes do front e da API.
# O merge automático do agente só acontece com tudo verde.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit        # tipos em modo strict
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  painel:
    name: Painel (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/painel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/painel/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror   # nulidade e avisos como erro
      - run: dotnet test --no-build                    # inclui os testes com Testcontainers

  semgrep:
    name: Semgrep (invariantes)
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config .semgrep/ --error
