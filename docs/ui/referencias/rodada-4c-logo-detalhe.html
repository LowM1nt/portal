<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrão visual — rodada 4c: detalhe da logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --fundo:#110b1b; --sup:rgba(30,19,45,.85); --sup2:#251a36; --borda:rgba(155,77,255,.16); --texto:#f5effb; --suave:#b3a6c9; --apagado:#7f7396; --roxo:#9b4dff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--fundo); color: var(--texto); padding: 48px 32px 96px; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 420px at 85% -5%, rgba(155,77,255,.30), transparent 70%), radial-gradient(800px 380px at 0% 100%, rgba(214,92,255,.16), transparent 70%); }
  .pagina { max-width: 1160px; margin: 0 auto; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
  .intro { color: var(--suave); margin-top: 10px; font-size: 15px; line-height: 1.6; max-width: 820px; }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 32px; }
  .card { background: var(--sup); backdrop-filter: blur(6px); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; }
  .topo { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--borda); }
  .topo b { display: inline-grid; place-items: center; min-width: 32px; height: 26px; border-radius: 8px; background: var(--sup2); font-size: 12px; font-weight: 800; }
  .topo span { font-weight: 800; font-size: 14px; white-space: nowrap; }
  .topo small { color: var(--suave); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .faixa { display: grid; grid-template-columns: 1fr 1fr; }
  .escuro, .claro { display: flex; align-items: center; justify-content: center; height: 130px; }
  .claro { background: #f6f3fb; }
  .logo { display: inline-flex; align-items: baseline; color: var(--texto); line-height: 1; font-size: 40px; }
  .claro .logo { color: #1a1225; }
  .logo .p { display: inline-block; background: var(--roxo); margin-left: var(--gap, .04em); width: var(--tam, .2em); height: var(--tam, .2em); border-radius: var(--forma, 50%); }
  .usos { display: flex; align-items: flex-end; justify-content: center; gap: 32px; height: 112px; padding-bottom: 14px; border-top: 1px solid var(--borda); }
  .uso { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--apagado); font-size: 11px; }
  .aba-nav { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; background: #2a1f3b; border-radius: 9px 9px 0 0; color: var(--suave); font-size: 12px; }
  .aba-nav .logo { font-size: 14px; }
  .dock-mini { width: 56px; height: 56px; border-radius: 16px; background: var(--sup2); border: 1px solid var(--borda); display: grid; place-items: center; }
  .dock-mini .logo { font-size: 24px; }
  .peq .logo { font-size: 20px; }
  .peq { display: flex; align-items: center; height: 56px; }
</style>
</head>
<body>
<div class="pagina">
  <h1>Rodada 4c: o detalhe do releasy.</h1>
  <p class="intro">Mesma ideia, ajustes finos: peso da letra, aperto entre letras e o formato do ponto. Repare também no "r." pequeno, que vira o ícone da aba e do dock.</p>
  <div class="grade" id="g"></div>
</div>
<script>
  const vs = [
    ['D1', 'Equilibrada', 'peso 800, ponto redondo (a da rodada anterior)', 'font-weight:800;letter-spacing:-0.045em', '--tam:.2em;--forma:50%'],
    ['D2', 'Leve e arejada', 'peso 600, mais espaço, ponto maior', 'font-weight:600;letter-spacing:-0.02em', '--tam:.22em;--forma:50%;--gap:.06em'],
    ['D3', 'Forte e compacta', 'peso 900, bem apertada, ponto quadradinho', 'font-weight:900;letter-spacing:-0.06em', '--tam:.2em;--forma:22%'],
    ['D4', 'Média com ponto em pílula', 'peso 700, ponto alongado ("pronto, foi")', 'font-weight:700;letter-spacing:-0.04em', '--tam:.18em;--forma:999px;width:.36em'],
  ];
  const g = document.getElementById('g');
  for (const [c, n, d, txt, ponto] of vs) {
    const logo = (palavra) => `<span class="logo" style="${txt}">${palavra}<i class="p" style="${ponto}"></i></span>`;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="topo"><b>${c}</b><span>${n}</span><small>${d}</small></div>
      <div class="faixa"><div class="escuro">${logo('releasy')}</div><div class="claro">${logo('releasy')}</div></div>
      <div class="usos">
        <div class="uso"><div class="aba-nav">${logo('r')}Releasy</div>aba do navegador</div>
        <div class="uso"><div class="dock-mini">${logo('r')}</div>topo do dock</div>
        <div class="uso"><div class="peq">${logo('releasy')}</div>cabeçalho pequeno</div>
      </div>`;
    g.appendChild(card);
  }
</script>
</body>
</html>
