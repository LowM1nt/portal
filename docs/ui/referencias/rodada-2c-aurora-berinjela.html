<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrão visual — rodada 2c: aurora berinjela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #08070c; color: #efedf7; padding: 48px 32px 80px; }
  .pagina { max-width: 1240px; margin: 0 auto; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
  .intro { color: #a8a3bd; margin-top: 10px; font-size: 15px; line-height: 1.6; max-width: 820px; }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: 36px; }
  .rotulo { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .rotulo b { display: inline-grid; place-items: center; min-width: 34px; height: 28px; border-radius: 9px; background: #2a2440; font-size: 13px; font-weight: 800; }
  .rotulo .n { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; }
  .rotulo .d { display: block; color: #a8a3bd; font-size: 13px; font-weight: 500; margin-top: 2px; white-space: nowrap; }

  .app { position: relative; height: 380px; border-radius: 22px; overflow: hidden; background: var(--fundo); border: 1px solid var(--borda); color: var(--texto); }
  .app::before { content: ""; position: absolute; inset: 0; background: var(--brilho, none); pointer-events: none; }
  .dock { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 56px; padding: 8px; display: flex; flex-direction: column; gap: 4px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 18px; box-shadow: var(--sombra); z-index: 2; }
  .dock .m { width: 40px; height: 40px; display: grid; place-items: center; }
  .dock .m i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--roxo), var(--roxo-claro)); }
  .dock .it { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--suave); }
  .dock .it svg { width: 19px; height: 19px; }
  .dock .it.ativo { background: var(--roxo); color: #fff; box-shadow: 0 6px 16px var(--roxo-sombra); }
  .dock .sep { height: 6px; }
  .dock .av { width: 40px; height: 40px; display: grid; place-items: center; }
  .dock .av i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--roxo-claro), #ff9ccc); }
  .conteudo { position: absolute; left: 84px; right: 0; top: 0; bottom: 0; padding: 26px 26px 22px; }
  .centro { max-width: 470px; margin: 0 auto; }
  .cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cab h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .cab p { color: var(--suave); font-size: 12px; margin-top: 3px; white-space: nowrap; }
  .botao { height: 34px; padding: 0 14px; border-radius: 11px; border: 1px solid transparent; font: 700 12.5px/1 Inter, sans-serif; display: inline-flex; align-items: center; white-space: nowrap; }
  .botao.p { background: var(--roxo); color: #fff; box-shadow: 0 6px 16px var(--roxo-sombra); }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
  .num { background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px; padding: 12px; box-shadow: var(--sombra); }
  .num small { color: var(--suave); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .num strong { display: block; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; margin-top: 3px; }
  .lista { margin-top: 12px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; box-shadow: var(--sombra); }
  .linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; padding: 0 14px; font-size: 12.5px; white-space: nowrap; }
  .linha + .linha { border-top: 1px solid var(--borda); }
  .selo { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ok { color: #34d399; background: rgba(52,211,153,.13); } .rod { color: var(--roxo-claro); background: var(--roxo-suave); } .fal { color: #fb7185; background: rgba(251,113,133,.14); }

  /* ---------- Aurora + Berinjela ---------- */
  .v1 { --fundo:#110b1b; --superficie:rgba(34,20,52,.78); --borda:rgba(155,77,255,.22); --texto:#f5effb; --suave:#b3a6c9; --sombra:0 10px 30px rgba(10,4,22,.6); --roxo:#9b4dff; --roxo-claro:#c89bff; --roxo-suave:rgba(155,77,255,.17); --roxo-sombra:rgba(155,77,255,.38); --brilho:radial-gradient(600px 260px at 85% -10%, rgba(155,77,255,.30), transparent 70%), radial-gradient(500px 240px at 0% 110%, rgba(214,92,255,.18), transparent 70%); }
  .v2 { --fundo:#130a1a; --superficie:rgba(38,18,50,.78); --borda:rgba(190,80,255,.22); --texto:#f5effb; --suave:#b3a6c9; --sombra:0 10px 30px rgba(10,4,22,.6); --roxo:#9b4dff; --roxo-claro:#d9a0ff; --roxo-suave:rgba(155,77,255,.17); --roxo-sombra:rgba(170,77,255,.40); --brilho:radial-gradient(620px 280px at 85% -10%, rgba(190,70,255,.32), transparent 70%), radial-gradient(520px 260px at 0% 110%, rgba(255,80,200,.20), transparent 70%); }
  .v3 { --fundo:#0d0914; --superficie:rgba(28,18,40,.80); --borda:rgba(155,77,255,.16); --texto:#f5effb; --suave:#b3a6c9; --sombra:0 10px 30px rgba(10,4,22,.6); --roxo:#9b4dff; --roxo-claro:#c89bff; --roxo-suave:rgba(155,77,255,.17); --roxo-sombra:rgba(155,77,255,.32); --brilho:radial-gradient(520px 220px at 90% -15%, rgba(155,77,255,.18), transparent 70%); }
  .v4 { --fundo:#110b1b; --superficie:rgba(34,20,52,.78); --borda:rgba(155,77,255,.22); --texto:#f5effb; --suave:#b3a6c9; --sombra:0 10px 30px rgba(10,4,22,.6); --roxo:linear-gradient(135deg,#9b4dff,#d34dff); --roxo-claro:#d29bff; --roxo-suave:rgba(155,77,255,.17); --roxo-sombra:rgba(190,77,255,.40); --brilho:radial-gradient(600px 260px at 85% -10%, rgba(155,77,255,.30), transparent 70%), radial-gradient(500px 240px at 0% 110%, rgba(214,92,255,.18), transparent 70%); }
  .v5 { --fundo:#120b1c; --superficie:rgba(34,20,54,.78); --borda:rgba(155,77,255,.22); --texto:#f5effb; --suave:#b3a6c9; --sombra:0 10px 30px rgba(10,4,22,.6); --roxo:#9b4dff; --roxo-claro:#c89bff; --roxo-suave:rgba(155,77,255,.17); --roxo-sombra:rgba(155,77,255,.38); --brilho:radial-gradient(700px 300px at 50% -20%, rgba(155,77,255,.34), transparent 70%); }
  .v6 { --fundo:#0f0a1c; --superficie:rgba(30,20,54,.78); --borda:rgba(140,92,255,.22); --texto:#f5effb; --suave:#b3a6c9; --sombra:0 10px 30px rgba(10,4,22,.6); --roxo:#9b4dff; --roxo-claro:#c89bff; --roxo-suave:rgba(155,77,255,.17); --roxo-sombra:rgba(155,77,255,.38); --brilho:radial-gradient(600px 260px at 85% -10%, rgba(110,92,255,.30), transparent 70%), radial-gradient(500px 240px at 0% 110%, rgba(214,77,255,.20), transparent 70%); }
  .app .dock, .app .num, .app .lista { backdrop-filter: blur(8px); }
  .dock .m i { background: linear-gradient(135deg, #9b4dff, #d29bff); }
</style>
</head>
<body>
<div class="pagina">
  <h1>Rodada 2c: Aurora + Berinjela</h1>
  <p class="intro">Fundo com brilho e vidro fosco do Aurora, com o roxo dos botões do Berinjela. Muda a intensidade e a cor dos brilhos; na V4 o botão é em degradê.</p>
  <div class="grade" id="grade"></div>
</div>
<template id="t">
  <div class="app">
    <nav class="dock">
      <div class="m"><i></i></div>
      <div class="it ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></div>
      <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>
      <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a4 4 0 0 0-4-4h-3"/></svg></div>
      <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
      <div class="sep"></div>
      <div class="av"><i></i></div>
    </nav>
    <div class="conteudo"><div class="centro">
      <div class="cab"><div><h3>Semana de 17 a 23 de nov.</h3><p>4 deploys · 2 PRs esperando você</p></div><span class="botao p">+ Novo deploy</span></div>
      <div class="nums"><div class="num"><small>Deploys</small><strong>12</strong></div><div class="num"><small>PRs abertas</small><strong>8</strong></div><div class="num"><small>CI ok</small><strong>94%</strong></div></div>
      <div class="lista">
        <div class="linha"><span>Filtro por ambiente nos deploys</span><span class="selo ok">Sucesso</span></div>
        <div class="linha"><span>Correção do lead time</span><span class="selo rod">Rodando</span></div>
        <div class="linha"><span>Novo tema escuro</span><span class="selo fal">Falhou</span></div>
      </div>
    </div></div>
  </div>
</template>
<script>
  const tons = [
    ['V1', 'v1', 'Aurora berinjela', 'o fundo do Aurora com o roxo do Berinjela, direto'],
    ['V2', 'v2', 'Aurora magenta', 'brilhos puxando para o magenta/rosa, mais quente'],
    ['V3', 'v3', 'Aurora discreta', 'fundo mais escuro e um brilho só, mais sóbrio'],
    ['V4', 'v4', 'Aurora degradê', 'botões em degradê do berinjela ao magenta'],
    ['V5', 'v5', 'Aurora central', 'um brilho único no topo, centralizado'],
    ['V6', 'v6', 'Aurora dupla', 'brilho violeta-azulado em cima, magenta embaixo'],
  ];
  const g = document.getElementById('grade');
  for (const [c, cls, n, d] of tons) {
    const col = document.createElement('div');
    col.innerHTML = `<div class="rotulo"><b>${c}</b><span><span class="n">${n}</span><span class="d">${d}</span></span></div>`;
    const a = document.getElementById('t').content.cloneNode(true);
    a.firstElementChild.classList.add(cls);
    col.appendChild(a);
    g.appendChild(col);
  }
</script>
</body>
</html>
